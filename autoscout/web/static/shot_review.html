<!doctype html>
<html lang="en"><meta charset="utf-8"><title>2026 shot review</title>
<style>body{background:#111827;color:#eee;font:16px system-ui;max-width:1500px;margin:24px auto;padding:12px}button,select{font:inherit;padding:9px;margin:5px}img,video{width:100%;max-height:65vh;object-fit:contain}#error{color:#f99}label{display:inline-block;margin:10px}</style>
<h1>2026 shot review</h1><p>Follow the yellow ball back to its robot. Choose its box and read the team from the bumper; use the video to check. Automatic team predictions are hidden. “Unclear” is a valid answer.</p>
<p id="progress"></p><button id="prev">Previous</button><button id="next">Next</button><button id="resume">Next unlabeled</button><span id="title"></span>
<img id="frame" alt="Shot frame with tracked robot boxes and yellow ball trajectory" style="cursor:crosshair">
<label>Frame offset <input id="offset" type="range" min="-3" max="3" step="0.1" value="0"><span id="dt">0 s</span></label>
<div><label>Physical robot <select id="slot"></select></label><label>Bumper team <select id="team"></select></label><button id="save">Save & next</button><button id="unknown">Unclear</button><button id="notmake">Not a make</button></div>
<details><summary>Watch original video</summary><video id="video" controls preload="none"></video><button id="seek">Replay shot</button></details><p id="error" role="alert"></p><pre id="summary"></pre>
<script>
let rows=[],labels={},i=0;
const el=id=>document.getElementById(id);
el('frame').onclick=e=>{if(Number(el('offset').value)!==0)return;const img=el('frame'),rect=img.getBoundingClientRect(),scale=Math.min(rect.width/img.naturalWidth,rect.height/img.naturalHeight),x=(e.clientX-rect.left-(rect.width-img.naturalWidth*scale)/2)/scale,y=(e.clientY-rect.top-(rect.height-img.naturalHeight*scale)/2)/scale;const hits=rows[i].boxes.filter(b=>x>=b.box[0]&&x<=b.box[2]&&y>=b.box[1]&&y<=b.box[3]);hits.sort((a,b)=>(a.box[2]-a.box[0])*(a.box[3]-a.box[1])-(b.box[2]-b.box[0])*(b.box[3]-b.box[1]));if(hits.length)el('slot').value=hits[0].slot};
async function api(url,options){const r=await fetch(url,options);if(!r.ok)throw Error(await r.text());return r.json()}
function show(){const r=rows[i],l=labels[r.id];el('title').textContent=`${r.match} · ${r.t.toFixed(2)} s · ${i+1}/${rows.length}${l?' · saved':''}`;el('progress').textContent=`${Object.keys(labels).length} reviewed`;el('offset').value=0;el('dt').textContent='0 s';el('frame').src=`/api/frame/${i}`;el('slot').innerHTML='<option value="">Box unclear / hidden</option>'+r.boxes.map(b=>`<option>${b.slot}</option>`).join('');el('team').innerHTML='<option value="">Choose bumper team</option>'+r.teams.map(t=>`<option>${t}</option>`).join('');if(l){el('slot').value=l.slot||'';el('team').value=l.team||''}el('video').src=`/video/${i}#t=${Math.max(0,r.t-2)},${r.t1+1}`;el('error').textContent=''}
async function save(status){try{if(status==='labeled'&&!el('team').value)throw Error('Choose a bumper team, or mark this shot unclear.');const l={id:rows[i].id,team:status==='labeled'?Number(el('team').value):null,slot:status==='labeled'?(el('slot').value||null):null,status};await api('/api/label',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(l)});labels[l.id]=l;if(i<rows.length-1)i++;show();el('summary').textContent=JSON.stringify(await api('/api/summary'),null,2)}catch(e){el('error').textContent=e.message}}
el('prev').onclick=()=>{i=Math.max(0,i-1);show()};el('next').onclick=()=>{i=Math.min(rows.length-1,i+1);show()};el('resume').onclick=()=>{let j=rows.findIndex(r=>!labels[r.id]);if(j>=0)i=j;show()};el('offset').onchange=()=>{let dt=el('offset').value;el('dt').textContent=dt+' s';el('frame').src=`/api/frame/${i}?dt=${dt}`};el('save').onclick=()=>save('labeled');el('unknown').onclick=()=>save('unknown');el('notmake').onclick=()=>save('not_make');el('seek').onclick=()=>{el('video').currentTime=Math.max(0,rows[i].t-2);el('video').play()};api('/api/items').then(d=>{rows=d.items;labels=d.labels;if(!rows.length)throw Error('No shots prepared');i=Math.max(0,rows.findIndex(r=>!labels[r.id]));show()}).catch(e=>el('error').textContent=e.message);
</script></html>
