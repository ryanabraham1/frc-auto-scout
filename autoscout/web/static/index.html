<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRC Auto-Scout</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #16181d; --muted: #5d6573; --line: #e2e5ea;
  --accent: #2a5bd7; --red: #d13438; --blue: #1f6fd1; --good: #1e8e3e; --warn: #b26a00;
  --red-soft: #fdecec; --blue-soft: #eaf2fd; --chip: #eef0f4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111318; --panel: #1a1d24; --ink: #e8eaef; --muted: #9aa3b2; --line: #2b303b;
    --accent: #7aa2ff; --red: #ff6b6e; --blue: #5ea2ff; --good: #4cc16c; --warn: #e7a33e;
    --red-soft: #3a2224; --blue-soft: #1c2a40; --chip: #262a33;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--ink); }
header { display: flex; align-items: center; gap: 18px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header b { font-size: 16px; letter-spacing: .2px; }
header nav a { color: var(--muted); text-decoration: none; margin-right: 14px; }
header nav a:hover { color: var(--ink); }
main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 22px; margin: 4px 0 14px; } h2 { font-size: 16px; margin: 22px 0 10px; }
a { color: var(--accent); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.muted { color: var(--muted); } .small { font-size: 12px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--chip); font-size: 12px; margin-right: 4px; }
.chip.red { background: var(--red-soft); color: var(--red); } .chip.blue { background: var(--blue-soft); color: var(--blue); }
.chip.good { color: var(--good); } .chip.warn { color: var(--warn); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 12px; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--panel); }
th:first-child, td:first-child { text-align: left; }
tr:hover td { background: var(--chip); }
.scroll { overflow-x: auto; }
button, select, input { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; }
button { cursor: pointer; } button.primary { background: var(--accent); color: #fff; border-color: transparent; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.alli { border-left: 4px solid var(--line); } .alli.red { border-left-color: var(--red); } .alli.blue { border-left-color: var(--blue); }
.score { font-size: 28px; font-weight: 700; } .score.red { color: var(--red); } .score.blue { color: var(--blue); }
.bar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--chip); min-width: 120px; }
.bar span { display: block; height: 100%; }
.canvaswrap { position: relative; display: inline-block; max-width: 100%; }
.canvaswrap img { max-width: 100%; display: block; }
.canvaswrap canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; cursor: crosshair; }
pre { background: var(--chip); padding: 10px; border-radius: 8px; max-height: 260px; overflow: auto; font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; margin-right: 12px; font-size: 12px; color: var(--muted); }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
@media (max-width: 640px) { main { padding: 14px 16px; } header { gap: 10px; } }
</style>
</head>
<body>
<header><b>FRC Auto-Scout</b><nav><a href="#/">Events</a><a href="#/jobs">Processing</a><a href="#/label">Label robots</a></nav></header>
<main id="app"><p class="muted">Loading…</p></main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');
const api = async (p, opt) => { const r = await fetch(p, opt); if (!r.ok) throw new Error(await r.text()); return r.headers.get('content-type')?.includes('json') ? r.json() : r.text(); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = v => typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(1)) : (v === true ? 'Yes' : v === false ? 'No' : esc(v ?? '–'));
const PERIOD_COLORS = ['#7b61ff','#9aa3b2','#2a9d8f','#e9c46a','#f4a261','#e76f51','#264653'];

function sortable(table) {
  table.querySelectorAll('th').forEach((th, i) => th.onclick = () => {
    const rows = [...table.tBodies[0].rows], dir = th.dataset.dir = th.dataset.dir === 'desc' ? 'asc' : 'desc';
    rows.sort((a, b) => { const x = a.cells[i].dataset.v ?? a.cells[i].textContent, y = b.cells[i].dataset.v ?? b.cells[i].textContent;
      const nx = parseFloat(x), ny = parseFloat(y); const c = (!isNaN(nx) && !isNaN(ny)) ? nx - ny : String(x).localeCompare(String(y)); return dir === 'desc' ? -c : c; });
    rows.forEach(r => table.tBodies[0].appendChild(r));
  });
}

async function viewEvents() {
  const evs = await api('/api/events');
  app.innerHTML = `<h1>Events</h1>
  <div class="card row"><input id="ek" placeholder="event key, e.g. 2026txhou" style="min-width:240px">
  <button class="primary" id="go">Open</button><span class="muted small">An event must be calibrated once (Calibrate) before matches can be processed.</span></div>
  <div class="grid">${evs.map(e => `<div class="card"><div class="row" style="justify-content:space-between"><a href="#/event/${e.event_key}"><b>${e.event_key}</b></a>
    <span class="chip ${e.calibrated ? 'good' : 'warn'}">${e.calibrated ? 'calibrated' : 'needs calibration'}</span></div>
    <div class="muted small">${e.done}/${e.matches} matches processed</div>
    <div class="small" style="margin-top:6px"><a href="#/calibrate/${e.event_key}">Calibrate</a></div></div>`).join('') || '<p class="muted">No events yet.</p>'}</div>`;
  $('#go').onclick = () => location.hash = `#/event/${$('#ek').value.trim()}`;
}

async function viewEvent(ek) {
  const d = await api(`/api/event/${ek}`);
  const defs = d.metric_defs;
  const cols = defs.map(m => `<th title="${esc(m.group)}">${esc(m.label)}</th>`).join('');
  const cell = (t, m) => { const v = t[`${m.key}.avg`]; if (v !== undefined) return `<td data-v="${v}">${fmt(v)}</td>`;
    const c = t[`${m.key}.counts`]; return `<td class="small">${c ? Object.entries(c).map(([k, n]) => `${esc(k)}×${n}`).join(' ') : '–'}</td>`; };
  app.innerHTML = `<h1>${ek}</h1>
  <div class="card row"><button class="primary" id="run">Process new matches</button><a href="#/calibrate/${ek}">Calibrate</a>
   <a href="/api/run/${ek}/log" target="_blank">Processing log</a><span class="muted small" id="job">${d.job?.running ? 'processing…' : ''}</span></div>
  <h2>Teams <span class="muted small">(averages per match; click a column to sort)</span></h2>
  <div class="card scroll"><table id="tt"><thead><tr><th>Team</th><th>Matches</th>${cols}</tr></thead><tbody>
  ${d.teams.map(t => `<tr><td><a href="#/team/${ek}/${t.team}">${t.team}</a></td><td>${t.matches}</td>${defs.map(m => cell(t, m)).join('')}</tr>`).join('')}
  </tbody></table></div>
  <h2>Matches</h2><div class="card scroll"><table><thead><tr><th>Match</th><th>Red</th><th>Blue</th><th>Score</th><th>Status</th></tr></thead><tbody>
  ${d.matches.map(m => `<tr><td>${m.status === 'done' ? `<a href="#/match/${m.match_key}">${esc(m.label || m.match_key)}</a>` : esc(m.label || m.match_key)}</td>
   <td style="color:var(--red)">${m.red.join(' ')}</td><td style="color:var(--blue)">${m.blue.join(' ')}</td>
   <td>${m.red_score ?? ''}–${m.blue_score ?? ''}</td><td>${m.status === 'error' ? `<span class="chip warn" title="${esc(m.error)}">error</span>` : `<span class="chip">${esc(m.status)}</span>`}</td></tr>`).join('')}
  </tbody></table></div>`;
  sortable($('#tt'));
  $('#run').onclick = async () => { await api(`/api/run/${ek}`, {method: 'POST'}); $('#job').textContent = 'processing… (refresh to see new matches)'; };
}

function timelineSVG(tl, clock) {
  const W = 760, H = 180, P = 30; if (!tl || !tl.t.length) return '';
  const t0 = clock ? clock.auto_end_vt - clock.auto_len - 2 : tl.t[0], t1 = clock ? clock.teleop_end_vt + 5 : tl.t.at(-1);
  const ymax = Math.max(10, ...tl.red, ...tl.blue);
  const X = t => P + (t - t0) / (t1 - t0) * (W - 2 * P), Y = v => H - P + 8 - v / ymax * (H - 2 * P);
  const path = arr => tl.t.map((t, i) => t >= t0 && t <= t1 ? `${X(t).toFixed(1)},${Y(arr[i]).toFixed(1)}` : null).filter(Boolean).join(' ');
  let marks = '';
  if (clock) { const ts = clock.teleop_end_vt; [[clock.auto_end_vt, 'auto end'], [ts - 130, 'S1'], [ts - 105, 'S2'], [ts - 80, 'S3'], [ts - 55, 'S4'], [ts - 30, 'end game']]
    .forEach(([t, l]) => marks += `<line x1="${X(t)}" x2="${X(t)}" y1="${P - 10}" y2="${H - P + 8}" stroke="var(--line)"/><text x="${X(t) + 3}" y="${P - 2}" font-size="10" fill="var(--muted)">${l}</text>`); }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Score over time">${marks}
    <polyline fill="none" stroke="var(--red)" stroke-width="2" points="${path(tl.red)}"/><polyline fill="none" stroke="var(--blue)" stroke-width="2" points="${path(tl.blue)}"/>
    <text x="${P}" y="${H - 6}" font-size="10" fill="var(--muted)">score read from broadcast overlay</text></svg>`;
}

async function viewMatch(mk) {
  const r = await api(`/api/match/${mk}`);
  const defs = r.metric_defs;
  const periods = r.year === 2026 ? ['auto','transition','shift1','shift2','shift3','shift4','endgame'] : null;
  const allianceTable = a => {
    const teams = Object.entries(r.teams).filter(([, m]) => m.alliance === a).sort((x, y) => x[1].station - y[1].station);
    return `<div class="card alli ${a}"><div class="row" style="justify-content:space-between"><b style="color:var(--${a})">${a.toUpperCase()}</b>
      <span class="score ${a}">${r[a + '_score'] ?? ''}</span></div>
      <div class="scroll"><table><thead><tr><th>Team</th>${defs.map(m => `<th>${esc(m.label)}</th>`).join('')}</tr></thead><tbody>
      ${teams.map(([t, m]) => `<tr><td><a href="#/team/${r.event_key}/${t}">${t}</a></td>${defs.map(d => `<td>${fmt(m[d.key])}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
      ${periods ? `<div style="margin-top:10px"><div class="legend">${periods.map((p, i) => `<span><i style="background:${PERIOD_COLORS[i]}"></i>${p}</span>`).join('')}</div>
        ${teams.map(([t, m]) => { const tot = Math.max(1, ...Object.values(r.teams).map(x => x.fuel_scored));
          return `<div class="row small" style="margin:4px 0"><span style="width:52px">${t}</span><div class="bar" style="width:${Math.max(4, 100 * m.fuel_scored / tot)}%;max-width:70%">
          ${periods.map((p, i) => `<span title="${p}: ${m.fuel_scored_by_period[p]}" style="width:${100 * m.fuel_scored_by_period[p] / Math.max(1, m.fuel_scored)}%;background:${PERIOD_COLORS[i]}"></span>`).join('')}</div>
          <span class="muted">${m.fuel_scored} scored · ${m.fuel_fed} fed</span></div>`; }).join('')}</div>` : ''}
      ${r.alliances?.[a] ? `<div class="small muted" style="margin-top:8px">${Object.entries(r.alliances[a]).map(([k, v]) => `${esc(k)}: <b>${fmt(v)}</b>`).join(' · ')}</div>` : ''}
    </div>`; };
  const slotRows = ['red','blue'].map(a => [0,1,2].map(i => { const s = `${a}${i}`;
    const c = r.identity_conf[s]; const cc = c >= 0.7 ? 'good' : 'warn';
    return `<label class="small">${s} <span class="chip ${cc}" title="identity confidence">${c ?? '?'}</span><select data-slot="${s}">${r[a].map(t => `<option ${r.identity[s] == t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`; }).join(' ')).join('<br>');
  const yt = t => `https://www.youtube.com/watch?v=${r.video}&t=${Math.max(0, Math.floor(t - 2))}s`;
  app.innerHTML = `<h1>${esc(r.label)} <span class="muted small">${mk}</span></h1>
  <div class="card">${timelineSVG(r.timeline, r.clock)}</div>
  ${allianceTable('red')}${allianceTable('blue')}
  <div class="card"><b>Robot identity</b> <span class="muted small">Each tracked robot slot is matched to a team from bumper-number OCR and official per-robot results; low-confidence slots (orange) should be checked on the video. Fixing one recomputes the stats instantly.</span>
   <div style="margin:8px 0">${slotRows}</div><button id="ov">Save identity</button></div>
  <h2>Events</h2><div class="card scroll"><table><thead><tr><th>Video time</th><th>Kind</th><th>Team</th><th>Period</th><th>Zone</th><th>Pieces</th></tr></thead><tbody>
  ${(r.events || []).filter(e => e.kind !== 'unexplained').slice(0, 600).map(e => `<tr><td><a target="_blank" href="${yt(e.t)}">${e.t.toFixed(1)}s</a></td><td>${esc(e.kind)}</td>
   <td>${e.team ?? (e.alliance ? e.alliance + ' HP' : '–')}</td><td>${esc(e.period || e.phase || '')}</td><td>${esc(e.zone || '')}</td><td>${fmt(e.n ?? e.points)}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="muted small">Detector: ${esc(r.detector)} · processed in ${r.processing_s}s · scored totals come from the official FMS breakdown; per-robot splits come from video.</p>`;
  $('#ov').onclick = async () => { const body = {}; document.querySelectorAll('select[data-slot]').forEach(s => body[s.dataset.slot] = +s.value);
    await api(`/api/override/${mk}`, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)}); viewMatch(mk); };
}

async function viewTeam(ek, team) {
  const [rows, ev] = await Promise.all([api(`/api/team/${ek}/${team}`), api(`/api/event/${ek}`)]);
  const defs = ev.metric_defs;
  app.innerHTML = `<h1>Team ${team} <span class="muted small">${ek}</span></h1>
  <div class="card scroll"><table id="tt"><thead><tr><th>Match</th><th>Alliance</th>${defs.map(m => `<th>${esc(m.label)}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(m => `<tr><td><a href="#/match/${m.match_key}">${m.match_key.split('_')[1]}</a></td><td><span class="chip ${m.alliance}">${m.alliance}${m.station}</span></td>
  ${defs.map(d => `<td>${fmt(m[d.key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  sortable($('#tt'));
}

async function viewCalibrate(ek) {
  const c = await api(`/api/calibration/${ek}`);
  if (!c.has_reference) { app.innerHTML = `<h1>Calibrate ${ek}</h1><div class="card">No reference frame yet. Run:<pre>autoscout calibrate ${ek}_qm1</pre>then reload this page.</div>`; return; }
  const pts = {...c.points}, aux = {...c.aux_views}; let view = c.view || null; let mode = 'point';
  const auxNames = c.elements.filter(e => /^(red|blue)_/.test(e));
  app.innerHTML = `<h1>Calibrate ${ek}</h1>
  <div class="card small">1. Drag a rectangle around the <b>wide shot of the whole field</b> (exclude the score bar and picture-in-picture views).
   2. Pick a landmark and click where it touches the carpet. Use at least 4 spread-out landmarks (corners, center-line ends, hub/reef centers).
   x = 0 is the blue alliance wall; y = 0 is the side named in configs/fields/${c.year}.yaml.</div>
  <div class="card row"><button id="mv">Draw view rectangle</button><select id="lm">${Object.keys(c.landmarks).map(k => `<option>${k}</option>`).join('')}</select>
   <button id="mp" class="primary">Click landmark</button><button id="clr">Remove landmark</button><button id="save" class="primary">Save</button><span id="msg" class="muted small"></span></div>
  <div class="card small">Close-up views (optional): picture-in-picture cameras on one field element, e.g. hub or reef cams.
   Name each after the element it shows so bumper numbers read there count as "this team was at that element".
   Leave out sponsor banners and score graphics that sit over the picture.</div>
  <div class="card row"><input id="auxn" list="auxl" placeholder="element, e.g. red_hub" style="width:14em"><datalist id="auxl">${auxNames.map(k => `<option>${k}</option>`).join('')}</datalist>
   <button id="ma">Draw close-up</button><span id="auxs" class="row small"></span></div>
  <div class="canvaswrap card" style="padding:4px"><img id="img" src="/api/calibration/${ek}/ref.jpg"><canvas id="cv"></canvas></div>
  <h2>Preview</h2><div class="card" style="padding:4px"><img id="prev" style="max-width:100%" src="/api/calibration/${ek}/preview.jpg?${Date.now()}"></div>`;
  const img = $('#img'), cv = $('#cv'), ctx = cv.getContext('2d');
  const listAux = () => { $('#auxs').innerHTML = Object.keys(aux).map(k => `<span class="chip">${esc(k)} <a href="#" data-k="${esc(k)}">×</a></span>`).join(' ') || '<span class="muted">none</span>';
    $('#auxs').querySelectorAll('a').forEach(a => a.onclick = e => { e.preventDefault(); delete aux[a.dataset.k]; draw(); }); };
  const draw = () => { cv.width = img.naturalWidth; cv.height = img.naturalHeight; ctx.clearRect(0, 0, cv.width, cv.height); ctx.lineWidth = 3;
    if (view) { ctx.strokeStyle = '#fff'; ctx.strokeRect(...view); }
    Object.entries(aux).forEach(([k, r]) => { ctx.strokeStyle = ctx.fillStyle = '#ffb000'; ctx.setLineDash([12, 6]); ctx.strokeRect(...r); ctx.setLineDash([]); ctx.font = '22px sans-serif'; ctx.fillText(k, r[0] + 8, r[1] + 26); });
    Object.entries(pts).forEach(([k, [x, y]]) => { ctx.strokeStyle = ctx.fillStyle = '#ff2bd6'; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.stroke(); ctx.font = '20px sans-serif'; ctx.fillText(k, x + 9, y - 9); });
    listAux(); };
  img.onload = draw;
  const toImg = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * cv.width / b.width, (e.clientY - b.top) * cv.height / b.height]; };
  const rect = (a, b) => [Math.round(Math.min(a[0], b[0])), Math.round(Math.min(a[1], b[1])), Math.round(Math.abs(b[0] - a[0])), Math.round(Math.abs(b[1] - a[1]))];
  let drag = null;
  cv.onmousedown = e => { if (mode === 'view' || mode === 'aux') drag = toImg(e); };
  cv.onmouseup = e => { const p = toImg(e);
    if (mode === 'view' && drag) { view = rect(drag, p); drag = null; mode = 'point'; }
    else if (mode === 'aux' && drag) { const r = rect(drag, p); drag = null; mode = 'point'; if (r[2] >= 8 && r[3] >= 8) aux[$('#auxn').value.trim()] = r; }
    else if (mode === 'point') pts[$('#lm').value] = p.map(Math.round); draw(); };
  $('#mv').onclick = () => mode = 'view'; $('#mp').onclick = () => mode = 'point'; $('#clr').onclick = () => { delete pts[$('#lm').value]; draw(); };
  $('#ma').onclick = () => { if (!$('#auxn').value.trim()) { $('#msg').textContent = 'name the close-up first (the element it shows, e.g. red_hub)'; return; } mode = 'aux'; $('#msg').textContent = 'drag a rectangle around the close-up'; };
  $('#save').onclick = async () => { if (!view) { $('#msg').textContent = 'draw the view rectangle first'; return; }
    const res = await api(`/api/calibration/${ek}`, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({view, points: pts, aux_views: aux})});
    $('#msg').textContent = res.reprojection_error_m != null ? `saved, fit error ${res.reprojection_error_m.toFixed(2)} m` : 'saved (need ≥4 landmarks)'; $('#prev').src = `/api/calibration/${ek}/preview.jpg?${Date.now()}`; };
}

async function viewLabel() {
  const [vids, ds] = await Promise.all([api('/api/videos'), api('/api/dataset')]);
  const boxes = [];
  app.innerHTML = `<h1>Label robots</h1>
  <div class="card small"><b>Suggest</b> pre-fills boxes from the current detector. Fix them: draw a box around <b>every</b> robot you can see (whole robot incl. bumpers; pick the alliance first),
   click a box to delete it, then <b>Save frame</b>. Unlabeled robots teach the model they are background, so label all of them.
   ~150 frames spread over several matches makes a solid detector for an event; then <b>Train detector</b>. Dataset: <b>${ds.images}</b> labeled frames.</div>
  <div class="card row"><select id="vid">${vids.map(v => `<option>${v}</option>`).join('')}</select><input id="ev" placeholder="event key" style="width:120px">
   <label>t <input id="t" type="number" value="60" step="0.5" style="width:80px"></label><button id="load">Load frame</button>
   <select id="al"><option>red</option><option>blue</option></select><button id="sug">Suggest</button><button id="undo">Undo box</button>
   <button class="primary" id="save">Save frame</button><button id="next">Save &amp; +5 s</button><button id="prop" title="SAM2 tracking; drifts after a few seconds">Propagate 5 s</button>
   <button id="train">Train detector</button><span id="msg" class="muted small"></span></div>
  <div class="canvaswrap card" style="padding:4px"><img id="img"><canvas id="cv"></canvas></div>`;
  const img = $('#img'), cv = $('#cv'), ctx = cv.getContext('2d');
  const draw = () => { cv.width = img.naturalWidth; cv.height = img.naturalHeight; ctx.lineWidth = 3;
    boxes.forEach(([a, x0, y0, x1, y1]) => { ctx.strokeStyle = a === 'red' ? '#ff3b3b' : '#3b8bff'; ctx.strokeRect(x0, y0, x1 - x0, y1 - y0); }); };
  img.onload = draw;
  const load = () => { img.src = `/api/frame.jpg?video=${encodeURIComponent($('#vid').value)}&t=${$('#t').value}`; boxes.length = 0; draw(); };
  $('#load').onclick = load;
  const toImg = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * cv.width / b.width, (e.clientY - b.top) * cv.height / b.height]; };
  let s = null; cv.onmousedown = e => s = toImg(e);
  cv.onmouseup = e => { if (!s) return; const p = toImg(e);
    if (Math.abs(p[0] - s[0]) <= 6) { const i = boxes.findIndex(b => p[0] >= b[1] && p[0] <= b[3] && p[1] >= b[2] && p[1] <= b[4]); if (i >= 0) boxes.splice(i, 1); s = null; draw(); return; }
    boxes.push([$('#al').value, Math.min(s[0], p[0]), Math.min(s[1], p[1]), Math.max(s[0], p[0]), Math.max(s[1], p[1])].map((v, i) => i ? Math.round(v) : v)); s = null; draw(); };
  $('#undo').onclick = () => { boxes.pop(); draw(); };
  const body = () => JSON.stringify({video: $('#vid').value, event: $('#ev').value, t: +$('#t').value, robots: boxes, duration: 5, fps: 4});
  const H = {'content-type': 'application/json'};
  $('#prop').onclick = async () => { await api('/api/label/seeds', {method: 'POST', headers: H, body: body()}); $('#msg').textContent = 'propagating in background…'; };
  $('#sug').onclick = async () => { const b = await api(`/api/label/suggest?video=${encodeURIComponent($('#vid').value)}&t=${$('#t').value}&event=${$('#ev').value}`); boxes.length = 0; boxes.push(...b); draw(); };
  const save = async () => { const r = await api('/api/label/save', {method: 'POST', headers: H, body: body()}); $('#msg').textContent = `saved ${r.stem}`; };
  $('#save').onclick = save;
  $('#next').onclick = async () => { await save(); $('#t').value = (+$('#t').value + 5).toFixed(1); load(); };
  $('#train').onclick = async () => { await api('/api/train', {method: 'POST'}); $('#msg').textContent = 'training started (see data/train.log)'; };
  if (vids.length) load();
}

let jobsTimer = null;
async function viewJobs() {
  const fmtS = s => s == null ? '–' : s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`;
  const draw = async () => {
    if (!location.hash.startsWith('#/jobs')) { clearInterval(jobsTimer); return; }
    const jobs = await api('/api/progress');
    app.innerHTML = `<h1>Processing</h1><p class="muted small">Updates every 2 seconds.</p>` + (jobs.map(j => {
      const col = j.stage === 'error' ? 'var(--red)' : j.stage === 'done' ? 'var(--good)' : 'var(--accent)';
      return `<div class="card"><div class="row" style="justify-content:space-between"><b>${j.stage === 'done' ? `<a href="#/match/${j.match_key}">${j.match_key}</a>` : esc(j.match_key)}</b>
        <span class="small muted">${esc(j.stage)}${j.stale ? ' · no update for 2+ min' : ''} · elapsed ${fmtS(j.elapsed_s)}${j.eta_s != null ? ' · ~' + fmtS(j.eta_s) + ' left' : ''}</span></div>
        <div class="bar" style="height:12px;margin:8px 0" role="progressbar" aria-valuenow="${j.pct}"><span style="width:${j.pct}%;background:${col}"></span></div>
        <div class="small muted">${j.pct.toFixed(0)}% · ${esc(j.error || j.detail || '')}</div></div>`; }).join('') || '<p class="muted">Nothing processing right now.</p>');
  };
  clearInterval(jobsTimer); await draw(); jobsTimer = setInterval(draw, 2000);
}

async function route() {
  const h = location.hash.slice(2).split('/');
  try {
    if (h[0] === 'event') await viewEvent(h[1]);
    else if (h[0] === 'match') await viewMatch(h[1]);
    else if (h[0] === 'team') await viewTeam(h[1], h[2]);
    else if (h[0] === 'calibrate') await viewCalibrate(h[1]);
    else if (h[0] === 'label') await viewLabel();
    else if (h[0] === 'jobs') await viewJobs();
    else await viewEvents();
  } catch (e) { app.innerHTML = `<div class="card">Error: ${esc(e.message)}</div>`; }
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route); route();
</script>
</body>
</html>
