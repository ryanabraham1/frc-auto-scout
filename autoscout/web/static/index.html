<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRC Auto-Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fafafa; --surface: #ffffff; --surface-2: #f4f4f5; --ink: #18181b; --ink-2: #3f3f46; --muted: #71717a;
  --line: #e4e4e7; --line-2: #d4d4d8; --accent: #18181b; --accent-ink: #ffffff; --accent-soft: #f4f4f5;
  --live: #d97706; --live-soft: #fef3c7;
  --red: #dc2626; --red-soft: #fef2f2; --blue: #2563eb; --blue-soft: #eff6ff;
  --good: #16a34a; --good-soft: #f0fdf4; --warn: #b45309; --warn-soft: #fffbeb; --bad: #dc2626; --bad-soft: #fef2f2;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 2px 10px rgba(0, 0, 0, .04);
  --radius: 12px; --radius-sm: 8px; --side: 224px;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a; --surface: #141414; --surface-2: #1c1c1c; --ink: #fafafa; --ink-2: #d4d4d4; --muted: #8a8a8a;
    --line: #262626; --line-2: #333333; --accent: #fafafa; --accent-ink: #0a0a0a; --accent-soft: #262626;
    --live: #f59e0b; --live-soft: #2b2110;
    --red: #f87171; --red-soft: #2a1515; --blue: #60a5fa; --blue-soft: #14202f;
    --good: #4ade80; --good-soft: #13251a; --warn: #fbbf24; --warn-soft: #2a2210; --bad: #f87171; --bad-soft: #2a1515;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a0a; --surface: #141414; --surface-2: #1c1c1c; --ink: #fafafa; --ink-2: #d4d4d4; --muted: #8a8a8a;
  --line: #262626; --line-2: #333333; --accent: #fafafa; --accent-ink: #0a0a0a; --accent-soft: #262626;
  --live: #f59e0b; --live-soft: #2b2110;
  --red: #f87171; --red-soft: #2a1515; --blue: #60a5fa; --blue-soft: #14202f;
  --good: #4ade80; --good-soft: #13251a; --warn: #fbbf24; --warn-soft: #2a2210; --bad: #f87171; --bad-soft: #2a1515;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; } a:hover { text-decoration-color: currentColor; }
h1 { font-size: 26px; line-height: 1.2; letter-spacing: -.02em; margin: 0; font-weight: 700; }
h2 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
h3 { font-size: 13px; margin: 0; font-weight: 600; color: var(--ink-2); }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }

/* shell */
.shell { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
aside.side { position: sticky; top: 0; height: 100vh; background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px; font-weight: 700; font-size: 16px; letter-spacing: -.02em; color: var(--ink); }
.brand .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); position: relative; }
.brand .logo::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--live); }
nav.main { display: flex; flex-direction: column; gap: 2px; }
nav.main a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm); color: var(--ink-2); font-weight: 500; text-decoration: none; }
nav.main a svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; flex: none; }
nav.main a:hover { background: var(--surface-2); color: var(--ink); }
nav.main a[aria-current] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 8px; }
.live-pill { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.on { background: var(--live); box-shadow: 0 0 0 0 rgba(43, 138, 62, .5); animation: pulse 1.8s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, .55); } 70% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); } 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); } }
main { padding: 28px 36px 64px; max-width: 1360px; width: 100%; min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head p { margin: 6px 0 0; color: var(--muted); max-width: 720px; }
.crumb { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; display: inline-flex; gap: 6px; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 16px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid > .card { margin: 0; }
.cols-2 { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kpis { display: grid; gap: 16px; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.kpi .label { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi .value { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
.stack > * + * { margin-top: 10px; }

/* controls */
button, select, input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius-sm); padding: 7px 12px; min-height: 36px; }
button { cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: background .12s, border-color .12s; }
button:hover { background: var(--surface-2); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary:hover { filter: brightness(1.06); background: var(--accent); }
button.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
button.ghost:hover { background: var(--surface-2); }
button:disabled { opacity: .5; cursor: default; }
input[type=checkbox] { min-height: 0; padding: 0; width: 16px; height: 16px; accent-color: var(--accent); vertical-align: middle; }
label.opt { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
a.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; min-height: 36px; border-radius: var(--radius-sm); border: 1px solid var(--line-2); color: var(--ink); font-weight: 500; background: var(--surface); }
a.btn:hover { background: var(--surface-2); text-decoration: none; }
input:focus, select:focus { outline: none; border-color: var(--ink-2); box-shadow: 0 0 0 3px var(--surface-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--radius-sm); padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; min-height: 30px; padding: 4px 12px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* chips & badges */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip.red { background: var(--red-soft); color: var(--red); } .chip.blue { background: var(--blue-soft); color: var(--blue); }
.chip.good { background: var(--good-soft); color: var(--good); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.accent { background: var(--live-soft); color: var(--live); }

/* tables */
.table-wrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
table { border-collapse: collapse; width: 100%; }
td a, .card-head a, .vbody a { text-decoration: none; } td a:hover, .card-head a:hover { text-decoration: underline; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
th { font-weight: 600; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; user-select: none; background: var(--surface); position: sticky; top: 0; }
th:first-child, td:first-child { text-align: left; padding-left: 0; } th:last-child, td:last-child { padding-right: 0; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); }

/* progress, bars */
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: 99px; background: var(--live); transition: width .6s ease; }
.progress.good > span { background: var(--good); } .progress.bad > span { background: var(--bad); }
.bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--surface-2); min-width: 120px; }
.bar span { display: block; height: 100%; }
.job { padding: 14px 0; border-bottom: 1px solid var(--line); } .job:last-child { border-bottom: 0; padding-bottom: 0; } .job:first-child { padding-top: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -1px; }

/* accuracy meter */
.meter { position: relative; height: 26px; margin: 6px 0 2px; }
.meter .track { position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 4px; background: var(--surface-2); }
.meter .fill { position: absolute; left: 0; top: 11px; height: 4px; border-radius: 4px; background: var(--ink-2); opacity: .5; }
.meter .mark { position: absolute; top: 4px; width: 2px; height: 18px; border-radius: 2px; }
.meter .mark.us { background: var(--ink); width: 4px; top: 2px; height: 22px; }
.meter .mark.eq { background: var(--muted); } .meter .mark.ceil { background: var(--good); }
.acc-num { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }

/* alliance */
.alli { border-top: 3px solid var(--line); } .alli.red { border-top-color: var(--red); } .alli.blue { border-top-color: var(--blue); }
.score { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.score.red { color: var(--red); } .score.blue { color: var(--blue); }
.teams-inline { font-family: var(--mono); font-size: 12px; }
.teams-inline .r { color: var(--red); } .teams-inline .b { color: var(--blue); }

/* videos */
.vgrid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.vcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); cursor: pointer; transition: transform .15s, box-shadow .15s; }
.vcard:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(15, 26, 43, .12); }
.vthumb { position: relative; aspect-ratio: 16 / 7.4; background: #000; overflow: hidden; }
.vthumb video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.vthumb .play { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.45)); }
.vthumb .play span { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.vthumb .play svg { width: 18px; height: 18px; fill: #0f1a2b; margin-left: 3px; }
.vbody { padding: 12px 14px 14px; }
.player { background: #000; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.player video { display: block; width: 100%; max-height: 74vh; background: #000; }
dialog.modal { border: 0; padding: 0; border-radius: var(--radius); background: var(--surface); color: var(--ink); width: min(1280px, 94vw); box-shadow: 0 30px 80px rgba(0,0,0,.45); }
dialog.modal::backdrop { background: rgba(8, 12, 20, .7); backdrop-filter: blur(3px); }
dialog.modal .mhead { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
dialog.modal video { display: block; width: 100%; max-height: 78vh; background: #000; }

/* robots labelling */
.robots { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.robot { margin: 0; } .robot.done { opacity: .7; }
.robot img { width: 100%; height: 160px; object-fit: contain; background: #000; border-radius: var(--radius-sm); margin-bottom: 8px; }
.robot .teams { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.robot button.team { padding: 3px 9px; font-size: 13px; min-height: 30px; }
.robot button.team.red { color: var(--red); } .robot button.team.blue { color: var(--blue); }
.robot button.team.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.canvaswrap { position: relative; display: block; max-width: 100%; }
.canvaswrap img { max-width: 100%; display: block; }
.canvaswrap canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
pre { background: var(--surface-2); padding: 12px; border-radius: var(--radius-sm); max-height: 260px; overflow: auto; font-size: 12px; }

/* toast, skeleton */
.notice { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 18px; background: var(--ink); color: var(--surface); border-radius: 10px; z-index: 50; max-width: 90vw; box-shadow: 0 10px 30px rgba(0,0,0,.25); font-weight: 500; }
.skel { background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 6px; height: 14px; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* mobile */
.topbar { display: none; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols-2 { grid-template-columns: 1fr; } }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  aside.side { display: none; }
  .topbar { display: flex; position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; gap: 12px; align-items: center; overflow-x: auto; }
  .topbar nav { display: flex; gap: 4px; }
  .topbar nav a { padding: 7px 10px; border-radius: var(--radius-sm); color: var(--ink-2); white-space: nowrap; font-weight: 500; }
  .topbar nav a[aria-current] { background: var(--surface-2); color: var(--ink); }
  main { padding: 20px 16px 48px; }
  h1 { font-size: 22px; }
  .card { padding: 14px 16px; }
  .table-wrap { margin: 0 -16px; padding: 0 16px; }
}
@media (max-width: 520px) { .kpis { grid-template-columns: 1fr 1fr; gap: 10px; } .kpi .value { font-size: 22px; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="logo"></span>Auto-Scout</div>
    <nav class="main" id="nav">
      <a href="#/" data-r=""><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg>Overview</a>
      <a href="#/events" data-r="events"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Events</a>
      <a href="#/videos" data-r="videos"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 10l5-3v10l-5-3z"/></svg>Videos</a>
      <a href="#/label" data-r="label"><svg viewBox="0 0 24 24"><path d="M4 4h7l9 9-7 7-9-9z"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>Label robots</a>
    </nav>
    <div class="side-foot">
      <span class="live-pill"><span class="dot" id="livedot"></span><span id="livetxt">Idle</span></span>
      <button class="ghost small" id="theme" style="justify-content:flex-start;padding-left:0">Toggle theme</button>
    </div>
  </aside>
  <div style="min-width:0">
    <div class="topbar"><div class="brand"><span class="logo"></span></div><nav id="nav2">
      <a href="#/" data-r="">Overview</a><a href="#/events" data-r="events">Events</a><a href="#/videos" data-r="videos">Videos</a><a href="#/label" data-r="label">Label</a></nav></div>
    <main id="app" aria-live="polite"><div class="skel" style="width:40%;height:26px"></div></main>
  </div>
</div>
<div id="notice" role="status" hidden></div>
<dialog class="modal" id="modal"><div class="mhead"><b id="mtitle"></b><span class="spacer"></span><a class="btn" id="mdl" download>Download</a><a class="btn" id="mopen">Open match</a><button class="ghost" id="mclose" aria-label="Close">✕</button></div><video id="mvideo" controls playsinline></video></dialog>
<script>
const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');
function notify(message) { const n = $('#notice'); n.className = 'notice'; n.textContent = message; n.hidden = false; clearTimeout(window.noticeTimer); window.noticeTimer = setTimeout(() => n.hidden = true, 6000); }
window.addEventListener('unhandledrejection', e => { e.preventDefault(); notify(e.reason?.message || 'Action failed. Try again.'); document.querySelectorAll('button:disabled').forEach(b => b.disabled = false); });
const api = async (p, opt) => { const r = await fetch(p, opt); if (!r.ok) { let msg = await r.text(); try { msg = JSON.parse(msg).detail || msg; } catch {} throw new Error(msg); } return r.headers.get('content-type')?.includes('json') ? r.json() : r.text(); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const fmt = v => typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(1)) : (v === true ? 'Yes' : v === false ? 'No' : esc(v ?? '–'));
const fmtS = s => s == null ? '–' : s >= 60 ? `${Math.floor(s / 60)}m ${String(Math.round(s % 60)).padStart(2, '0')}s` : `${Math.round(s)}s`;
const ago = ts => { const s = Date.now() / 1000 - ts; return s < 60 ? 'just now' : s < 3600 ? `${Math.floor(s / 60)} min ago` : s < 86400 ? `${Math.floor(s / 3600)} h ago` : `${Math.floor(s / 86400)} d ago`; };
const PERIOD_COLORS = ['#7950f2', '#868e96', '#12b886', '#fab005', '#fd7e14', '#f03e3e', '#1c7ed6'];
const H = {'content-type': 'application/json'};
let timer = null;
const every = (ms, fn) => { clearInterval(timer); timer = setInterval(fn, ms); };

// theme
const savedTheme = (() => { try { return localStorage.getItem('theme'); } catch { return null; } })();
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$('#theme').onclick = () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('theme', t); } catch {} };

// video modal
function openVideo(name, title, mk) { const m = $('#modal'); $('#mtitle').textContent = title; $('#mvideo').src = `/api/annotated/${name}`; $('#mdl').href = `/api/annotated/${name}?download=1`; $('#mopen').href = `#/match/${mk}`; m.showModal(); $('#mvideo').play().catch(() => {}); }
$('#mclose').onclick = () => $('#modal').close();
$('#modal').addEventListener('close', () => { $('#mvideo').pause(); $('#mvideo').removeAttribute('src'); $('#mvideo').load(); });
$('#mopen').onclick = () => $('#modal').close();

function sortable(table) {
  table.querySelectorAll('th').forEach((th, i) => th.onclick = () => {
    const rows = [...table.tBodies[0].rows], dir = th.dataset.dir = th.dataset.dir === 'desc' ? 'asc' : 'desc';
    rows.sort((a, b) => { const x = a.cells[i].dataset.v ?? a.cells[i].textContent, y = b.cells[i].dataset.v ?? b.cells[i].textContent;
      const nx = parseFloat(x), ny = parseFloat(y); const c = (!isNaN(nx) && !isNaN(ny)) ? nx - ny : String(x).localeCompare(String(y)); return dir === 'desc' ? -c : c; });
    rows.forEach(r => table.tBodies[0].appendChild(r));
  });
}
const head = (title, sub = '', actions = '', crumb = '') => `<div class="page-head"><div>${crumb ? `<div class="crumb">${crumb}</div>` : ''}<h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${actions ? `<div class="row">${actions}</div>` : ''}</div>`;
const teamsInline = (red, blue) => `<span class="teams-inline"><span class="r">${(red || []).join(' ')}</span> <span class="muted">vs</span> <span class="b">${(blue || []).join(' ')}</span></span>`;
const PLAY = '<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';

// ---------------------------------------------------------------- overview
function liveJobs(progress) {
  const act = progress.filter(j => !['done', 'error'].includes(j.stage));
  if (!act.length) return `<div class="empty">Nothing processing right now.<div class="small" style="margin-top:6px">Start an event from <a href="#/events">Events</a> or run <span class="mono">autoscout run-event</span>.</div></div>`;
  return act.map(j => `<div class="job"><div class="row"><b><a href="#/match/${j.match_key}">${esc(j.match_key)}</a></b><span class="chip ${j.stale ? 'warn' : 'accent'}">${esc(j.stage)}</span><span class="spacer"></span>
    <span class="small muted num">${j.pct.toFixed(0)}% · ${fmtS(j.elapsed_s)}${j.eta_s != null ? ' · ~' + fmtS(j.eta_s) + ' left' : ''}</span><button class="small ghost" data-cancel="${esc(j.match_key.split('_')[0])}" title="Stop this event's processing job">Cancel</button></div>
    <div class="progress" style="margin:8px 0 6px"><span style="width:${j.pct}%"></span></div><div class="small muted">${esc(j.detail || '')}${j.stale ? ' · no update for 2+ min' : ''}</div></div>`).join('');
}
function accCard(a) {
  if (!a.metrics?.length) return `<div class="card"><div class="card-head"><h2>${esc(a.event)}</h2></div><div class="small muted">Not enough processed matches yet.</div></div>`;
  return `<div class="card"><div class="card-head"><h2><a href="#/event/${a.event}">${esc(a.event)}</a></h2><span class="chip">${a.matches} matches</span></div>
   ${a.metrics.map(m => { const pct = v => Math.max(0, Math.min(100, v * 100));
     const lift = m.r - m.r_equal;
     return `<div style="margin-bottom:12px"><div class="row"><h3>${esc(m.label)} vs OPR</h3><span class="spacer"></span><span class="chip ${lift > 0.03 ? 'good' : lift < -0.03 ? 'bad' : 'warn'}">${lift >= 0 ? '+' : ''}${lift.toFixed(2)} vs no-video</span></div>
     <div class="row" style="align-items:baseline;gap:8px"><span class="acc-num num">${m.r.toFixed(2)}</span><span class="small muted">correlation · error ${m.mae} vs ${m.mae_equal} per match</span></div>
     <div class="meter"><div class="track"></div><div class="fill" style="width:${pct(m.r)}%"></div>
      <div class="mark eq" style="left:${pct(m.r_equal)}%" title="equal split ${m.r_equal}"></div><div class="mark ceil" style="left:${pct(m.r_ceiling)}%" title="ceiling ${m.r_ceiling}"></div><div class="mark us" style="left:calc(${pct(m.r)}% - 2px)"></div></div>
     <div class="legend"><span><i style="background:var(--ink)"></i>scouter</span><span><i style="background:var(--muted)"></i>equal split ${m.r_equal.toFixed(2)}</span><span><i style="background:var(--good)"></i>ceiling ${m.r_ceiling.toFixed(2)}</span></div></div>`; }).join('')}</div>`;
}
function recentRows(recent) {
  if (!recent.length) return `<tr><td colspan="5" class="empty">No processed matches yet.</td></tr>`;
  return recent.map(r => `<tr><td><a href="#/match/${r.match_key}"><b>${esc(r.label || r.match_key)}</b></a><div class="small muted">${esc(r.match_key)}</div></td>
    <td class="num"><span style="color:var(--red)">${r.red_score ?? '–'}</span> – <span style="color:var(--blue)">${r.blue_score ?? '–'}</span></td>

}
function wireVideoButtons(root = document) {
  root.querySelectorAll('[data-play]').forEach(b => b.onclick = e => { e.stopPropagation(); openVideo(b.dataset.play, b.dataset.title, b.dataset.mk); });
  root.querySelectorAll('[data-render]').forEach(b => b.onclick = async e => { e.stopPropagation(); b.disabled = true; const r = await api(`/api/annotate/${b.dataset.render}`, {method: 'POST'});

  const tick = async () => {
    if (location.hash.replace(/^#\/?/, '') !== '') return;
    const d = await api('/api/runs');

    const today = d.recent.filter(r => Date.now() / 1000 - r.finished < 86400).length;

  const evs = (d?.events || []).filter(e => e.processed >= 4).map(e => e.event_key);

function timelineSVG(tl, clock) {
  const W = 760, Hh = 190, P = 32; if (!tl || !tl.t.length) return '';
  const t0 = clock ? clock.auto_end_vt - clock.auto_len - 2 : tl.t[0], t1 = clock ? clock.teleop_end_vt + 5 : tl.t.at(-1);
  const ymax = Math.max(10, ...tl.red, ...tl.blue);
  const X = t => P + (t - t0) / (t1 - t0) * (W - 2 * P), Y = v => Hh - P + 8 - v / ymax * (Hh - 2 * P);
  const path = arr => tl.t.map((t, i) => t >= t0 && t <= t1 ? `${X(t).toFixed(1)},${Y(arr[i]).toFixed(1)}` : null).filter(Boolean).join(' ');
  let marks = '';
  if (clock) { const ts = clock.teleop_end_vt; [[clock.auto_end_vt, 'auto end'], [ts - 130, 'S1'], [ts - 105, 'S2'], [ts - 80, 'S3'], [ts - 55, 'S4'], [ts - 30, 'endgame']]
    .forEach(([t, l]) => marks += `<line x1="${X(t)}" x2="${X(t)}" y1="${P - 10}" y2="${Hh - P + 8}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${X(t) + 4}" y="${P - 2}" font-size="10" fill="var(--muted)">${l}</text>`); }
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Score over time">${marks}
    <polyline fill="none" stroke="var(--red)" stroke-width="2.2" stroke-linejoin="round" points="${path(tl.red)}"/><polyline fill="none" stroke="var(--blue)" stroke-width="2.2" stroke-linejoin="round" points="${path(tl.blue)}"/>
    <text x="${P}" y="${Hh - 6}" font-size="10" fill="var(--muted)">score read from the broadcast overlay</text></svg>`;
}

    const teams = Object.entries(r.teams).filter(([, m]) => m.alliance === a).sort((x, y) => x[1].station - y[1].station);
    return `<div class="card alli ${a}"><div class="card-head"><h2 style="color:var(--${a})">${a === 'red' ? 'Red' : 'Blue'} alliance</h2><span class="score ${a}">${r[a + '_score'] ?? ''}</span></div>
      <div class="table-wrap"><table><thead><tr><th>Team</th>${defs.map(m => `<th>${esc(m.label)}</th>`).join('')}</tr></thead><tbody>
      ${teams.map(([t, m]) => `<tr><td><a href="#/team/${r.event_key}/${t}"><b>${t}</b></a></td>${defs.map(d => `<td>${fmt(m[d.key])}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
      ${periods ? `<div style="margin-top:14px"><div class="legend" style="margin-bottom:8px">${periods.map((p, i) => `<span><i style="background:${PERIOD_COLORS[i]}"></i>${p}</span>`).join('')}</div>
        ${teams.map(([t, m]) => { const tot = Math.max(1, ...Object.values(r.teams).map(x => x.fuel_scored));
          return `<div class="row small" style="margin:6px 0;flex-wrap:nowrap"><span style="width:48px" class="num"><b>${t}</b></span><div class="bar" style="width:${Math.max(4, 100 * m.fuel_scored / tot)}%;max-width:62%">
          ${periods.map((p, i) => `<span title="${p}: ${m.fuel_scored_by_period?.[p] ?? 0}" style="width:${100 * (m.fuel_scored_by_period?.[p] ?? 0) / Math.max(1, m.fuel_scored)}%;background:${PERIOD_COLORS[i]}"></span>`).join('')}</div>
          <span class="muted num">${m.fuel_scored} scored · ${m.fuel_fed} fed</span></div>`; }).join('')}</div>` : ''}
      ${r.alliances?.[a] ? `<div class="small muted" style="margin-top:10px">${Object.entries(r.alliances[a]).map(([k, v]) => `${esc(k.replaceAll('_', ' '))}: <b>${fmt(v)}</b>`).join(' · ')}</div>` : ''}
    </div>`; };
  const slotRows = ['red', 'blue'].map(a => `<div class="row" style="margin:6px 0">${[0, 1, 2].map(i => { const s = `${a}${i}`;
    const c = r.identity_conf?.[s]; const cc = c >= 0.7 ? 'good' : 'warn';
    return `<label class="row small" style="gap:6px"><span class="chip ${a}">${s}</span><select data-slot="${s}">${r[a].map(t => `<option ${r.identity[s] == t ? 'selected' : ''}>${t}</option>`).join('')}</select><span class="chip ${cc}" title="identity confidence">${c ?? '?'}</span></label>`; }).join('')}</div>`).join('');
  const yt = t => `https://www.youtube.com/watch?v=${r.video}&t=${Math.max(0, Math.floor(t - 2))}s`;
  const av = r.annotated_video, seekable = av && av.offset != null;
  app.innerHTML = head(esc(r.label), teamsInline(r.red, r.blue),
    `${av && av.downloadable ? `<a class="btn" href="/api/annotated/${mk}_annotated.mp4?download=1" download>Download video</a>` : ''}<a class="btn" href="#/robots/${mk}">Who is this?</a><a class="btn" target="_blank" href="https://www.youtube.com/watch?v=${r.video}">YouTube</a>${av ? '' : `<button class="primary" data-render="${mk}">Render annotated video</button>`}`,
    `<a href="#/events">Events</a> / <a href="#/event/${r.event_key}">${esc(r.event_key)}</a> / ${esc(mk)}`) +
  `${av ? `<div class="player" style="margin-bottom:16px"><video id="av" controls preload="metadata" src="/api/match/${mk}/video.mp4"></video></div>` : ''}
  <div class="card"><div class="card-head"><h2>Score over time</h2><div class="legend"><span><i style="background:var(--red)"></i>red</span><span><i style="background:var(--blue)"></i>blue</span></div></div>${timelineSVG(r.timeline, r.clock)}</div>
  <div class="cols-2">${allianceTable('red')}${allianceTable('blue')}</div>
  <div class="card"><div class="card-head"><h2>Robot identity</h2><button id="ov">Save identity</button></div>
   <div class="small muted" style="margin-bottom:8px">Each tracked robot slot is matched to a team from bumper numbers and official per-robot results. Check low-confidence (orange) slots on the video; fixing one recomputes the stats.</div>${slotRows}</div>
  <div class="card"><div class="card-head"><h2>Events</h2><span class="small muted">${seekable ? 'Click a time to jump the video there' : 'Times link to YouTube'}</span></div><div class="table-wrap" style="max-height:520px;overflow:auto"><table><thead><tr><th>Video time</th><th>Kind</th><th>Team</th><th>Period</th><th>Zone</th><th>Pieces</th></tr></thead><tbody>
  ${(r.events || []).filter(e => e.kind !== 'unexplained' && e.kind !== 'scored').slice(0, 600).map(e => `<tr><td>${seekable ? `<a href="javascript:void 0" data-seek="${e.t}">${e.t.toFixed(1)}s</a> <a class="muted small" target="_blank" href="${yt(e.t)}">YT</a>` : `<a target="_blank" href="${yt(e.t)}">${e.t.toFixed(1)}s</a>`}</td><td><span class="chip">${esc(e.kind)}</span></td>
   <td>${e.team ? `<b>${e.team}</b>${e.shares && Object.keys(e.shares).length > 1 ? ` <span class="muted small">${Object.entries(e.shares).sort((a, b) => b[1] - a[1]).map(([t, v]) => `${t} ${Math.round(v * 100)}%`).join(' · ')}</span>` : ''}${e.placed ? ' <span class="chip">seen placed</span>' : ''}` : (e.alliance ? e.alliance + (['leave', 'foul2', 'foul6', 'park', 'shallow', 'deep'].includes(e.kind) ? '' : ' HP') : '–')}</td><td>${esc(e.period || e.phase || '')}</td><td>${esc(e.zone || '')}</td><td>${fmt(e.n ?? e.points)}</td></tr>`).join('')}
  </tbody></table></div></div>
  <p class="small muted">Detector: ${esc(r.detector)} · processed in ${r.processing_s}s · alliance totals come from the official FMS breakdown; per-robot splits come from video.</p>`;
  document.querySelectorAll('[data-seek]').forEach(a => a.onclick = () => { const v = $('#av');
    v.currentTime = Math.max(0, +a.dataset.seek - av.offset - 2); v.play(); v.scrollIntoView({behavior: 'smooth', block: 'center'}); });
  wireVideoButtons(app);
  $('#ov').onclick = async () => { const body = {}; document.querySelectorAll('select[data-slot]').forEach(s => body[s.dataset.slot] = +s.value);
    await api(`/api/override/${mk}`, {method: 'POST', headers: H, body: JSON.stringify(body)}); notify('Identity saved; stats recomputed.'); viewMatch(mk); };
}

async function viewTeam(ek, team) {
  const [rows, ev] = await Promise.all([api(`/api/team/${ek}/${team}`), api(`/api/event/${ek}`)]);
  const defs = ev.metric_defs;
  app.innerHTML = head(`Team ${team}`, `${rows.length} matches at ${esc(ek)}`, '', `<a href="#/events">Events</a> / <a href="#/event/${ek}">${esc(ek)}</a> / ${team}`) +
  `<div class="card"><div class="table-wrap"><table id="tt"><thead><tr><th>Match</th><th>Alliance</th>${defs.map(m => `<th>${esc(m.label)}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(m => `<tr><td><a href="#/match/${m.match_key}"><b>${m.match_key.split('_')[1]}</b></a></td><td><span class="chip ${m.alliance}">${m.alliance} ${m.station}</span></td>
  ${defs.map(d => `<td>${fmt(m[d.key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  sortable($('#tt'));
}

// ---------------------------------------------------------------- videos
async function viewVideos() {
  const vids = await api('/api/annotated');
  const evs = [...new Set(vids.map(v => v.event_key))];
  app.innerHTML = head('Annotated videos', 'Full broadcast with every tracked robot labelled by team, game-piece flights, and a live panel of what each robot is credited with. Render more from any processed match.',
    evs.length > 1 ? `<div class="seg" id="seg"><button class="on" data-e="">All</button>${evs.map(e => `<button data-e="${e}">${e}</button>`).join('')}</div>` : '') +
  (vids.length ? `<div class="vgrid" id="vg">${vids.map(v => `<div class="vcard" data-e="${v.event_key}" data-play="${v.name}" data-mk="${v.match_key}" data-title="${esc(v.label || v.match_key)}">
      <div class="vthumb"><video src="/api/annotated/${v.name}#t=40" preload="metadata" muted></video><div class="play"><span>${PLAY}</span></div></div>
      <div class="vbody"><div class="row"><b>${esc(v.label || v.match_key)}</b><span class="spacer"></span><span class="chip">${esc(v.event_key)}</span></div>
      <div class="row small" style="margin-top:6px">${teamsInline(v.red, v.blue)}<span class="spacer"></span><span class="num"><span style="color:var(--red)">${v.red_score ?? ''}</span>–<span style="color:var(--blue)">${v.blue_score ?? ''}</span></span></div>
      <div class="row small" style="margin-top:6px"><span class="muted">${v.size_mb} MB · rendered ${ago(v.updated)}</span><span class="spacer"></span><a class="btn small" href="/api/annotated/${v.name}?download=1" download onclick="event.stopPropagation()">Download</a></div></div></div>`).join('')}</div>`
    : `<div class="card empty">No annotated videos yet. Open a processed match and choose <b>Render annotated video</b>.</div>`);
  wireVideoButtons(app);
  app.querySelectorAll('#seg button').forEach(b => b.onclick = () => { app.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
    app.querySelectorAll('.vcard').forEach(c => c.hidden = b.dataset.e && c.dataset.e !== b.dataset.e); });
}

// ---------------------------------------------------------------- calibration, labelling
async function viewCalibrate(ek) {
  const c = await api(`/api/calibration/${ek}`);
  const crumb = `<a href="#/events">Events</a> / <a href="#/event/${ek}">${esc(ek)}</a> / calibrate`;
  if (!c.has_reference) { app.innerHTML = head(`Calibrate ${esc(ek)}`, 'Prepare a reference frame from a match video, then mark the field landmarks.', '', crumb) + `<div class="card row"><input id="refmatch" aria-label="Reference match key" value="${ek}_qm1"><button id="prepare" class="primary">Prepare reference frame</button><button id="reload">Check reference</button><a class="small" href="/api/run/${ek}/log" target="_blank">Preparation log</a></div>`; $('#prepare').onclick = async () => { await api(`/api/calibration/${ek}/prepare`, {method: 'POST', headers: H, body: JSON.stringify({match_key: $('#refmatch').value.trim()})}); notify('Preparing reference frame. Check the reference after the job finishes.'); }; $('#reload').onclick = () => viewCalibrate(ek); return; }
  const pts = {...c.points}; let view = c.view || null; let mode = 'point';
  app.innerHTML = head(`Calibrate ${esc(ek)}`, '', '', crumb) + `
  <div class="card small"><b>1.</b> Drag a rectangle around the wide shot of the whole field (exclude the score bar and picture-in-picture views).
   <b>2.</b> Pick a landmark and click where it touches the carpet. Use at least 4 spread-out landmarks (corners, center-line ends, hub/reef centers).
   x = 0 is the blue alliance wall; y = 0 is the side named in configs/fields/${c.year}.yaml.</div>
  <div class="card row"><button id="mv">Draw view rectangle</button><select id="lm">${Object.keys(c.landmarks).map(k => `<option>${k}</option>`).join('')}</select>
   <button id="mp">Click landmark</button><button id="clr">Remove landmark</button><span class="spacer"></span><span id="msg" class="muted small"></span><button id="save" class="primary">Save</button></div>
  <div class="card" style="padding:0;overflow:hidden"><div class="canvaswrap"><img id="img" src="/api/calibration/${ek}/ref.jpg"><canvas id="cv"></canvas></div></div>
  <div class="card"><div class="card-head"><h2>Preview</h2></div><img id="prev" style="max-width:100%;border-radius:8px" src="/api/calibration/${ek}/preview.jpg?${Date.now()}"></div>`;
  const img = $('#img'), cv = $('#cv'), ctx = cv.getContext('2d');
  const draw = () => { cv.width = img.naturalWidth; cv.height = img.naturalHeight; ctx.clearRect(0, 0, cv.width, cv.height); ctx.lineWidth = 3;
    if (view) { ctx.strokeStyle = '#fff'; ctx.strokeRect(...view); }
    Object.entries(pts).forEach(([k, [x, y]]) => { ctx.strokeStyle = ctx.fillStyle = '#ff2bd6'; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.stroke(); ctx.font = '20px sans-serif'; ctx.fillText(k, x + 9, y - 9); }); };
  img.onload = draw;
  const toImg = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * cv.width / b.width, (e.clientY - b.top) * cv.height / b.height]; };
  let drag = null;
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); if (mode === 'view') drag = toImg(e); };
  cv.onpointerup = e => { const p = toImg(e); if (mode === 'view' && drag) { view = [Math.round(Math.min(drag[0], p[0])), Math.round(Math.min(drag[1], p[1])), Math.round(Math.abs(p[0] - drag[0])), Math.round(Math.abs(p[1] - drag[1]))]; drag = null; mode = 'point'; }
    else if (mode === 'point') pts[$('#lm').value] = p.map(Math.round); draw(); };
  $('#mv').onclick = () => mode = 'view'; $('#mp').onclick = () => mode = 'point'; $('#clr').onclick = () => { delete pts[$('#lm').value]; draw(); };
  $('#save').onclick = async () => { if (!view) { $('#msg').textContent = 'Draw the view rectangle first.'; return; }
    const res = await api(`/api/calibration/${ek}`, {method: 'POST', headers: H, body: JSON.stringify({view, points: pts})});
    $('#msg').textContent = res.reprojection_error_m != null ? `Saved · fit error ${res.reprojection_error_m.toFixed(2)} m` : 'Saved (needs at least 4 landmarks)'; $('#prev').src = `/api/calibration/${ek}/preview.jpg?${Date.now()}`; };
}

async function viewLabel() {
  const [vids, ds] = await Promise.all([api('/api/label/videos'), api('/api/dataset')]);
  if (!vids.length) { app.innerHTML = head('Label robots') + '<div class="card empty">No local match videos yet. Process a match to download its video, then return here.</div>'; return; }
  const boxes = [];
  app.innerHTML = head('Label robots', `<b>Suggest</b> pre-fills boxes from the current detector. Box <b>every</b> robot (pick the alliance first), click a box to delete it, then save. Unlabelled robots teach the model they are background. Dataset: <b>${ds.hand_images}</b> corrected + <b>${ds.pseudo_images}</b> automatic frames. Training keeps whole matches separate for validation and deploys only a measured improvement.`) + `
  <div class="card row"><select id="vid" aria-label="Match video">${vids.map(v => `<option value="${esc(v.video)}">${esc(v.label)}</option>`).join('')}</select><input id="ev" placeholder="Event key" aria-label="Event key" style="width:120px">
   <label class="row small" style="gap:6px">Time <input id="t" type="number" value="60" step="0.5" style="width:84px"></label><button id="load">Load frame</button>
   <div class="seg" id="al"><button class="on" data-a="red" style="color:var(--red)">Red</button><button data-a="blue" style="color:var(--blue)">Blue</button></div>
   <button id="sug">Suggest</button><button id="undo">Undo box</button><span class="spacer"></span>
   <button class="primary" id="save">Save frame</button><button id="next">Save &amp; +5 s</button><button id="prop" title="SAM2 tracking; drifts after a few seconds">Propagate 5 s</button><button id="train">Train detector</button></div>
  <div class="small muted" id="trainstatus" role="status"></div>
  <div class="small muted" id="msg" style="margin:-6px 0 10px"></div>
  <div class="card" style="padding:0;overflow:hidden"><div class="canvaswrap"><img id="img"><canvas id="cv"></canvas></div></div>`;
  let alliance = 'red';
  app.querySelectorAll('#al button').forEach(b => b.onclick = () => { alliance = b.dataset.a; app.querySelectorAll('#al button').forEach(x => x.classList.toggle('on', x === b)); });
  const img = $('#img'), cv = $('#cv'), ctx = cv.getContext('2d');
  const draw = () => { cv.width = img.naturalWidth; cv.height = img.naturalHeight; ctx.lineWidth = 3;
    boxes.forEach(([a, x0, y0, x1, y1]) => { ctx.strokeStyle = a === 'red' ? '#ff3b3b' : '#3b8bff'; ctx.strokeRect(x0, y0, x1 - x0, y1 - y0); }); };
  let loaded = null;
  const selection = () => JSON.stringify({video: $('#vid').value, event: $('#ev').value, t: +$('#t').value});
  const frameButtons = enabled => ['save', 'next', 'prop', 'sug'].forEach(id => $('#' + id).disabled = !enabled);
  img.onload = () => { loaded = selection(); frameButtons(true); draw(); };
  img.onerror = () => { loaded = null; frameButtons(false); $('#msg').textContent = 'Could not load this frame. Check the video and time.'; };
  const load = () => { loaded = null; frameButtons(false); img.src = `/api/frame.jpg?video=${encodeURIComponent($('#vid').value)}&t=${$('#t').value}`; boxes.length = 0; draw(); };
  $('#ev').value = vids[0].event;
  ['t', 'ev'].forEach(id => $('#' + id).onchange = load);
  $('#vid').onchange = () => { $('#ev').value = vids.find(v => v.video === $('#vid').value)?.event || ''; load(); };
  $('#load').onclick = load;
  const toImg = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * cv.width / b.width, (e.clientY - b.top) * cv.height / b.height]; };
  let s = null; cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); s = toImg(e); };
  cv.onpointerup = e => { if (!s) return; const p = toImg(e);
    if (Math.abs(p[0] - s[0]) <= 6) { const i = boxes.findIndex(b => p[0] >= b[1] && p[0] <= b[3] && p[1] >= b[2] && p[1] <= b[4]); if (i >= 0) boxes.splice(i, 1); s = null; draw(); return; }
    boxes.push([alliance, Math.min(s[0], p[0]), Math.min(s[1], p[1]), Math.max(s[0], p[0]), Math.max(s[1], p[1])].map((v, i) => i ? Math.round(v) : v)); s = null; draw(); };
  $('#undo').onclick = () => { boxes.pop(); draw(); };
  const body = () => { if (!loaded || loaded !== selection()) throw new Error('Load the selected frame before saving.');
    return JSON.stringify({...JSON.parse(loaded), robots: boxes, duration: 5, fps: 4}); };
  $('#prop').onclick = async () => { await api('/api/label/seeds', {method: 'POST', headers: H, body: body()}); $('#msg').textContent = 'Propagating in the background…'; };
  $('#sug').onclick = async () => { const requested = loaded; body(); $('#sug').disabled = true;
    try { const b = await api(`/api/label/suggest?video=${encodeURIComponent($('#vid').value)}&t=${$('#t').value}&event=${encodeURIComponent($('#ev').value.trim())}`);
      if (requested !== loaded) return; boxes.length = 0; boxes.push(...b); draw(); }
    finally { $('#sug').disabled = !loaded; } };
  const save = async () => { const r = await api('/api/label/save', {method: 'POST', headers: H, body: body()}); $('#msg').textContent = `Saved ${r.stem}`; };
  $('#save').onclick = save;
  $('#next').onclick = async () => { await save(); $('#t').value = (+$('#t').value + 5).toFixed(1); load(); };
  const trainingState = d => { const job = d.train_job || {}; $('#train').disabled = !!job.running;
    $('#trainstatus').textContent = job.running ? `Training detector${job.epoch ? ` · epoch ${job.epoch}` : ''}… You can continue labeling.` :
      job.evaluation ? job.evaluation.reason : 'Ready to train. Candidates are tested before deployment.'; };
  trainingState(ds);
  $('#train').onclick = async () => { $('#train').disabled = true; await api('/api/train', {method: 'POST'});
    $('#trainstatus').textContent = 'Training started. Progress will appear here.'; };
  timer = setInterval(async () => { try { trainingState(await api('/api/dataset')); } catch {} }, 3000);
  load();
}

async function viewRobots(mk) {
  const pending = {};
  const draw = d => {
    const all = [...d.teams.red.map(t => [t, 'red']), ...d.teams.blue.map(t => [t, 'blue'])];
    const fmtT = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    app.innerHTML = head('Who is this?', `Click the team for each robot, then save. ${d.n_labelled} labelled so far. These are robots whose bumper couldn't be read; each label also fixes the robot before and after it.`,
      `<span id="msg" class="muted small"></span><button class="primary" id="save" disabled>Save labels &amp; recompute</button>`, `<a href="#/match/${mk}">${esc(mk)}</a> / identify robots`) +
    `<div class="robots">${d.robots.map(r => {
      const cur = pending[r.id] !== undefined ? pending[r.id] : r.manual;
      return `<div class="card robot ${r.manual != null ? 'done' : ''}"><img src="/api/match/${mk}/robot/${r.id}.jpg" alt="robot ${r.id}" loading="lazy">
        <div class="small muted">video ${fmtT(r.t0)}–${fmtT(r.t1)} · guess <b>${r.team ?? 'none'}</b>${r.read ? ` · read ${r.read}` : ''}</div>
        <div class="teams">${all.map(([t, a]) => `<button data-id="${r.id}" data-team="${t}" class="team ${a} ${cur === t ? 'on' : ''}">${t}</button>`).join('')}
          <button data-id="${r.id}" data-team="0" class="team ${cur === 0 ? 'on' : ''}">not a robot</button></div></div>`; }).join('')}</div>`;
    app.querySelectorAll('button.team').forEach(b => b.onclick = () => {
      const id = +b.dataset.id, t = +b.dataset.team;
      pending[id] = pending[id] === t ? null : t; draw(d); $('#save').disabled = !Object.keys(pending).length; });
    $('#save').disabled = !Object.keys(pending).length;
    $('#save').onclick = async () => {
      $('#save').disabled = true; $('#msg').textContent = 'Recomputing…';
      const nd = await api(`/api/match/${mk}/robots`, {method: 'POST', headers: H, body: JSON.stringify(pending)});
      for (const k in pending) delete pending[k];
      draw(nd); $('#msg').textContent = 'Saved; stats recomputed.';
    };
  };
  draw(await api(`/api/match/${mk}/robots`));
}

// ---------------------------------------------------------------- shell
async function sidebarLive() {
  try { const d = await api('/api/runs'); const n = d.progress.filter(j => !['done', 'error'].includes(j.stage)).length;
    $('#livedot').classList.toggle('on', n > 0); $('#livetxt').textContent = n ? `${n} match${n > 1 ? 'es' : ''} processing` : 'Idle'; } catch {}
}
setInterval(sidebarLive, 5000); sidebarLive();

async function route() {
  clearInterval(timer);
  if ($('#modal').open) $('#modal').close();
  const h = location.hash.replace(/^#\/?/, '').split('/');
  const top = {event: 'events', match: 'events', team: 'events', calibrate: 'events', robots: 'events', jobs: ''}[h[0]] ?? h[0];
  document.querySelectorAll('#nav a, #nav2 a').forEach(a => a.toggleAttribute('aria-current', a.dataset.r === top));
  try {
    if (h[0] === 'event') await viewEvent(h[1]);
    else if (h[0] === 'events') await viewEvents();
    else if (h[0] === 'match') await viewMatch(h[1]);
    else if (h[0] === 'robots') await viewRobots(h[1]);
    else if (h[0] === 'team') await viewTeam(h[1], h[2]);
    else if (h[0] === 'calibrate') await viewCalibrate(h[1]);
    else if (h[0] === 'label') await viewLabel();
    else if (h[0] === 'videos') await viewVideos();
    else await viewOverview();
  } catch (e) { app.innerHTML = `<div class="card"><h2>Something went wrong</h2><p class="muted">${esc(e.message)}</p></div>`; }
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route); route();
</script>
