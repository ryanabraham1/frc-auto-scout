[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoscout"
version = "0.1.0"
description = "Automated FRC match scouting from broadcast video"
requires-python = ">=3.10"
dependencies = [
  "numpy", "scipy", "opencv-python-headless", "requests", "pyyaml",
  "fastapi", "uvicorn", "yt-dlp[default]", "easyocr", "ultralytics", "lap",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
autoscout = "autoscout.cli:main"

[tool.setuptools.packages.find]
include = ["autoscout*"]

[tool.setuptools.package-data]
autoscout = ["web/static/*"]
